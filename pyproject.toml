[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docarena"
version = "0.1.0"
description = "CLI benchmark arena for German document vision-language models."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
docarena = "docarena.cli:console"

[tool.setuptools.packages.find]
where = ["."]
include = ["docarena*"]
